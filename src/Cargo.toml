[workspace]
members = [
    "core",
    "polyglot-parser",
    "si-layer/shared_memory",
]

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"
reqwest = "0.11"
hyperbeam-client = "0.1"
uuid = { version = "1.0", features = ["v4"] }
