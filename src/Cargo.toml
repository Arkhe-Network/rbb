[workspace]
members = [
    "substrato_5002",
    "substrato_8000",
    "substrato_9000",
    "core",
    "polyglot-parser",
    "si-layer/shared_memory",
]

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.102"
tracing = "0.1.44"
reqwest = "0.11"
hyperbeam-client = "0.1"
uuid = { version = "1.23.3", features = ["v4"] }
