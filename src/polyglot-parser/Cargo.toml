[package]
name = "polyglot-parser"
version = "0.1.0"
edition = "2021"

[dependencies]
# Tree-sitter
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-python = "0.20"
tree-sitter-go = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-lua = "0.1"
tree-sitter-solidity = "1.2"


# Serialização
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilitários
anyhow = "1.0"
tracing = "0.1"
regex = "1.10"
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
