[project]
name = "asi-llm"
version = "0.1.0"
description = "Fast Brain da ASI Cathedral"
authors = [{name = "ASI Cathedral", email = "cathedral@asi.org"}]
license = "AGPL-3.0"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "bittensor>=8.0.0",
    "transformers>=4.40.0",
    "torch>=2.0.0",
    "ollama>=0.3.0",
    "pydantic>=2.0.0",
    "tenacity>=8.0.0",
    "structlog>=24.0.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"
