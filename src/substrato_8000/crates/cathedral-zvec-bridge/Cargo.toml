[package]
name = "cathedral-zvec-bridge"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tonic = "0.11"
prost = "0.12"
tracing = "0.1"
futures = "0.3"
chrono = "0.4"
lru = "0.12"

[lib]
path = "src/lib.rs"
