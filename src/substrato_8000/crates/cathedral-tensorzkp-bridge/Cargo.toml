[package]
name = "cathedral-tensorzkp-bridge"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"

[lib]
path = "src/lib.rs"
