[package]
name = "substrato-5002"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
thiserror = "1.0"
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
async-trait = "0.1"

[lib]
path = "lib.rs"
