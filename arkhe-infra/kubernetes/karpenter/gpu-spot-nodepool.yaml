# kubernetes/karpenter/gpu-spot-nodepool.yaml
apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: gpu-spot-class
spec:
  amiFamily: AL2
  role: "KarpenterNodeRole-arkhe-cluster"
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: arkhe-cluster
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: arkhe-cluster
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
---
apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: gpu-spot-pool
spec:
  template:
    spec:
      nodeClassRef:
        name: gpu-spot-class
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["g4dn", "g5"]
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["3"]
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      labels:
        role: gpu-worker
        lifecycle: spot
  limits:
    cpu: 1000
    memory: 4000Gi
    nvidia.com/gpu: 50
  disruption:
    consolidationPolicy: WhenUnderutilized
    expireAfter: 72h
