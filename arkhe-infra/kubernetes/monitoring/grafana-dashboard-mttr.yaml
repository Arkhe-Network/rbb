# kubernetes/monitoring/grafana-dashboard-mttr.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-arkhe-resilience
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  arkhe-resilience.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "type": "stat",
          "title": "Mean Time to Recovery (MTTR) - P95",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(arkhe_mttr_seconds_bucket[5m])) by (le))",
              "legendFormat": "MTTR (Seconds)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 60 },
                  { "color": "red", "value": 120 }
                ]
              },
              "unit": "s"
            }
          }
        },
        {
          "type": "stat",
          "title": "GPU Failures Detected",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "targets": [
            {
              "expr": "sum(arkhe_gpu_failures_total)",
              "legendFormat": "Failures",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "value" }
            }
          }
        },
        {
          "type": "gauge",
          "title": "System Coherence",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "targets": [
            {
              "expr": "arkhe_coherence{project_id=\"global\"}",
              "legendFormat": "Coherence",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.8 },
                  { "color": "green", "value": 0.95 }
                ]
              }
            }
          }
        },
        {
          "type": "timeseries",
          "title": "MTTR Trend",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(arkhe_mttr_seconds_bucket[5m])) by (le))",
              "legendFormat": "MTTR (Seconds)",
              "refId": "A"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "GPU Workloads & Chaos Events",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 18 },
          "targets": [
            {
              "expr": "sum(kube_pod_status_phase{phase=\"Running\", namespace=\"arkhe\"})",
              "legendFormat": "Active Pods",
              "refId": "A"
            },
            {
              "expr": "rate(chaos_mesh_events_total[1m])",
              "legendFormat": "Chaos Events",
              "refId": "B"
            }
          ]
        }
      ],
      "title": "Arkhe/Resilience (MTTR & Chaos)",
      "uid": "arkhe-resilience",
      "version": 1
    }
