[workspace]
members = [
    "rust_data_plane",
    "orchestrator",
    "crates/aegis",
    "crates/aegis-plausible-reasoner",
    "cathedral-core",
    "cathedral-embodied-no_std",
    "cathedral-napi",
    "cathedral-wasm",
    "cathedral-orchestrator",
    "cathedral-royalties",
    "cathedral-sdk-rs",
    "zk-circuits",
    "cathedral-cse",
    "crates/cathedral-xtask",
    "crates/cathedral-bridge",
    "crates/cathedral-zk-circuits",
    "crates/cathedral-zk-risc0",
    "crates/cathedral-wormgraph",
    "crates/cathedral-nostr",
    "crates/cathedral-permissions",
    "crates/cathedral-tools",
    "crates/cathedral-skills",
    "crates/cathedral-agents",
    "crates/cathedral-opencode-bridge",
    "crates/cathedral-remix-bridge",
    "crates/cathedral-server",
    "crates/cathedral-cli",
    "crates/cathedral-harness",
    "crates/cathedral-self-improve"
, "crates/cathedral-identity"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Cathedral ARKHE Architects <architect@arkhe.network>"]
license = "Apache-2.0"
repository = "https://github.com/cathedral-arkhe/cathedral-arkhe"
rust-version = "1.91"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
anyhow = "1.0"
cargo-insta = "1.40"
cargo-llvm-cov = "0.5"
cargo-deadlinks = "0.9"
cargo-sbom = "0.4"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
which = "6.0"
