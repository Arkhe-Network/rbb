[workspace]
members = [
    "rust_data_plane",
    "orchestrator",
    "crates/aegis",
    "crates/aegis-plausible-reasoner",
    "cathedral-core",
    "cathedral-embodied-no_std",
    "cathedral-napi",
    "cathedral-wasm",
    "cathedral-orchestrator"
, "cathedral-royalties", "cathedral-sdk-rs", "zk-circuits", "cathedral-cse"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
rand = "0.8"
