[package]
name = "cathedral-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"] }
wasm-bindgen-futures = "0.4"
serde = { version = "1.0.228", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0.150"

# Note: These paths assume you are running inside a workspace where these crates exist.
# removed cathedral-agent since it's not a real crate in the root workspace
cathedral-embodied-no_std = { path = "../cathedral-embodied-no_std", default-features = false }

[profile.release]
opt-level = "z"          # Otimização para tamanho
lto = true
codegen-units = 1
