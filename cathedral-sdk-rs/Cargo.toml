[package]
name = "cathedral-sdk"
version = "0.1.0"
edition = "2021"

[dependencies]
common = { path = "../common" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
pqcrypto-dilithium = "0.3"
rand = "0.10.1"
tokio = { version = "1.52.3", features = ["sync", "time", "rt-multi-thread"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
uuid = { version = "1.23.3", features = ["v4"] }
blake3 = "1"
tracing = "0.1.44"
anyhow = "1.0.102"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4.45"
pqcrypto-traits = "0.3.5"
getrandom = "0.2"
rand_core = "0.6.4"
