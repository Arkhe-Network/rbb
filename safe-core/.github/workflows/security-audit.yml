name: Security Audit
on:
  schedule:
    - cron: '0 4 * * *' # Daily
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo-audit
        uses: rustsec/audit-check@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v1
