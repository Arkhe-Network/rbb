name: Verify Kani
on:
  schedule:
    - cron: '0 2 * * *' # Nightly
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Run Kani Proofs
        run: cargo kani
