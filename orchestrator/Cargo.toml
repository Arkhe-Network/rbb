[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.10.1"
opentelemetry = { version = "0.27", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "metrics"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
tracing-opentelemetry = { version = "0.29" }
prometheus-client = "0.22"
futures = "0.3"

ethers = { version = "2.0", features = ["rustls"] }
tokio = { version = "1.52.3", features = ["full", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
cron = "0.12.0"
bincode = "1.3"

blake3 = "1.3"
hex = "0.4"
axum = "0.8.9"
ndarray = { version = "0.17.2", optional = true }
nalgebra = { version = "0.32", optional = true }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.3", features = ["v4"] }
anyhow = "1.0.102"
base64 = "0.22.1"
async-trait = "0.1.89"

[features]
default = []
deployment-sim = ["ndarray", "nalgebra"]
