[workspace]
members = [
    "src/core",
    "src/bridge",
    "src/wormgraph",
    "src/nostr",
    "src/zk/risc0/methods/guest",
    "src/zk/circuits",
    "src/pqc",
    "src/swarm",
    "src/fl",
    "src/mcp",
    "src/anomaly",
    "src/xtask"
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.94"      # MSRV mínimo para sqlx 0.9 e wasmtime 45
authors = ["Cathedral ARKHE Architects <architect@arkhe.network>"]
license = "Apache-2.0"
repository = "https://github.com/cathedral-arkhe/cathedral-arkhe"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-stream = "0.1"

# Web framework
axum = "0.8"
tower = "0.5"
tower-http = "0.6"

# gRPC
tonic = "0.14"
prost = "0.13"

# HTTP client
reqwest = { version = "0.13", features = ["json", "rustls"] }

# TLS
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-pemfile = "2.0"

# P2P Networking (CORRIGIDO: libp2p 0.56.0)
libp2p = { version = "0.56", features = ["tokio", "tcp", "tls", "noise", "yamux", "gossipsub", "mdns", "quic"] }
libp2p-swarm = "0.46"

# PQC (CORRIGIDO: ml-dsa, ml-kem, slh-dsa)
ml-dsa = "0.1.1"           # FIPS 204 — Assinaturas primárias
ml-kem = "0.3.2"           # FIPS 203 — KEM (Kyber)
slh-dsa = "0.1.0"          # FIPS 205 — Assinaturas backup

# Machine Learning (CORRIGIDO: candle-core 0.10.2)
candle-core = "0.10.2"
candle-nn = "0.10.2"

# WASM runtime
wasmtime = { version = "45.0.2", features = ["cranelift", "component-model"] }

# Database
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "postgres"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto (classic)
ed25519-dalek = "2.1"
blake3 = "1.5"
sha3 = "0.10"

# Nostr
nostr-sdk = "0.38"

# ZK proving
risc0-zkvm = "1.2"
plonky2 = "1.0"

# Utilities
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# JNI (Android)
jni = "0.21"

[workspace.dev-dependencies]
cargo-insta = "1.40"
cargo-llvm-cov = "0.5"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
