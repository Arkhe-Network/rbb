[package]
name = "cathedral-royalties"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
chrono = { version = "0.4.45", features = ["serde"] }
axum = "0.8.9"
clap = { version = "4.0", features = ["derive"] }
inquire = "0.6"
ethers = { version = "2.0", features = ["rustls"] }
uuid = { version = "1.23.3", features = ["v4"] }
nostr-sdk = "0.36"
reqwest = { version = "0.12", features = ["json"] }
bytes = "1.0"
hex = "0.4"

[dev-dependencies]
mockito = "1.7.0"

[[bin]]
name = "migrate_pix_key"
path = "src/bin/migrate_pix_key.rs"

[[bin]]
name = "deploy_drex_contract"
path = "src/bin/deploy_drex_contract.rs"
