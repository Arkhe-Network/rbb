[package]
name = "arkhe-desci"
version = "12.0.0"
edition = "2021"
description = "Integração ARKHE × DeSciOS — governança, segurança e rastreabilidade"
license = "MIT OR Apache-2.0"

[dependencies]
arkhe-core = { path = "../arkhe-core" }
arkhe-governance = { path = "../arkhe-governance" }
cathedral-analysis = { path = "../cathedral-analysis" }
cathedral-core = { path = "../cathedral-core" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
blake3 = "1.5"
async-trait = { workspace = true }
regex = { workspace = true }
url = "2.5"
uuid = { workspace = true }

# Opcionais
reqwest = { workspace = true, optional = true }

[features]
default = []
ipfs = ["dep:reqwest"]
chainlink = ["dep:reqwest"]

[dev-dependencies]
tempfile = "3.10"
tokio = { workspace = true }
