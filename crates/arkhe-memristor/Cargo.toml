[package]
name = "arkhe-memristor"
version = "1.0.0"
edition = "2021"
description = "Rust driver for Ag/(PEA)₂(MA)Pb₂I₇/Ag-synDNA/Pt memristor — ultra-low voltage (<0.1V), low power (17 µW)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arkhe/arkhe-memristor"

[dependencies]
embedded-hal = { version = "1.0" }
embedded-hal-async = "1.0"
nb = "1.1"
cfg-if = "1.0"
num-traits = "0.2"
serde = { version = "1.0", features = ["derive"], optional = true }
tracing = "0.1"
thiserror = "1.0"

[dev-dependencies]
criterion = "0.5"
rand = "0.8"

[features]
default = ["std"]
std = ["serde"]
no-std = []
