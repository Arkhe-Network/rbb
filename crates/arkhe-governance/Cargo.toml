[package]
name = "arkhe-governance"
license = "MIT OR Apache-2.0"
version = "2.1.0"
edition = "2021"
authors = ["Arkhe Research Group"]
description = "Governance invariants for Arkhe OS"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
hex = "0.4"
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync", "rt"] }
